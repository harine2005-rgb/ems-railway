<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Employee Management</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            font-family: 'Segoe UI', Arial, sans-serif;
            background: linear-gradient(135deg, #080e20, #142c50, #301b52);
            background-size: 300% 300%;
            animation: backgroundMove 10s ease infinite;
        }

        @keyframes backgroundMove {
            0%, 100% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
        }

        .shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 7s ease-in-out infinite;
            pointer-events: none;
        }
        .shape1 { width: 180px; height: 180px; background: linear-gradient(135deg, #3b82f6, #9333ea); top: 10%; left: 12%; }
        .shape2 { width: 120px; height: 120px; background: linear-gradient(135deg, #06b6d4, #6366f1); bottom: 12%; right: 15%; animation-delay: 2s; }
        .shape3 { width: 70px; height: 70px; background: #a855f7; top: 65%; left: 20%; animation-delay: 1s; }

        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-35px) rotate(180deg); }
        }

        .login-card {
            position: relative;
            z-index: 2;
            width: 390px;
            max-width: calc(100% - 32px);
            padding: 40px;
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(22px);
            -webkit-backdrop-filter: blur(22px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 22px;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s ease, box-shadow 0.3s ease;
        }

        .login-icon {
            width: 75px;
            height: 75px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 20px;
            color: white;
            font-size: 32px;
            background: linear-gradient(135deg, #3b82f6, #9333ea);
            box-shadow: 0 12px 30px rgba(59, 130, 246, 0.4);
        }

        .login-card h2 { text-align: center; color: white; font-size: 28px; font-weight: 700; margin-bottom: 8px; }
        .login-card p { text-align: center; color: #cbd5e1; margin-bottom: 30px; }
        .form-label { color: white; font-weight: 600; }

        .form-control {
            padding: 13px;
            color: white;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }
        .form-control::placeholder { color: #cbd5e1; }
        .form-control:focus {
            color: white;
            background: rgba(255, 255, 255, 0.15);
            border-color: #60a5fa;
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.4);
        }

        .login-btn {
            width: 100%;
            padding: 13px;
            margin-top: 10px;
            border: none;
            border-radius: 10px;
            color: white;
            font-weight: 700;
            font-size: 16px;
            background: linear-gradient(135deg, #2563eb, #9333ea);
            box-shadow: 0 8px 20px rgba(37, 99, 235, 0.35);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        .login-btn:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(147, 51, 234, 0.4); }
        .login-btn:disabled { opacity: 0.7; cursor: wait; }

        #message { margin-top: 15px; text-align: center; min-height: 24px; }

        @media (max-width: 480px) {
            .login-card { padding: 28px; }
            .shape1 { width: 100px; height: 100px; }
            .shape2 { width: 80px; height: 80px; }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>

<body>
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>
    <div class="shape shape3"></div>

    <div class="login-card" id="loginCard">
        <div class="login-icon"><i class="fa-solid fa-users"></i></div>

        <h2>Welcome Back!</h2>
        <p>Employee Management System</p>

        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label" for="username">Username</label>
                <input type="text" id="username" class="form-control" placeholder="Enter username" autocomplete="username" required>
            </div>

            <div class="mb-3">
                <label class="form-label" for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter password" autocomplete="current-password" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-right-to-bracket"></i> Login
            </button>

            <div id="message" role="status"></div>
        </form>
    </div>

    <script src="login.js"></script>

    <script>
        // Gentle 3D tilt that follows the mouse
        const card = document.getElementById("loginCard");

        if (window.matchMedia("(hover: hover) and (pointer: fine)").matches) {
            document.addEventListener("mousemove", function (event) {
                const x = (window.innerWidth / 2 - event.clientX) / 45;
                const y = (window.innerHeight / 2 - event.clientY) / 45;
                card.style.transform = `perspective(1000px) rotateY(${-x}deg) rotateX(${y}deg)`;
            });

            document.addEventListener("mouseleave", function () {
                card.style.transform = "perspective(1000px) rotateY(0deg) rotateX(0deg)";
            });
        }
    </script>
</body>
</html>
